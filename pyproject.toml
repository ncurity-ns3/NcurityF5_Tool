[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "f5-field-automation"
version = "1.1.0"
description = "offline windows automation platform for f5 field engineers"
readme = "readme.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]
gui = [
    "PyQt6>=6.7",
    "PyQt6-WebEngine>=6.7",
    "flask>=3.0",
]
gui-mac = [
    "PyQt6>=6.7",
    "PyQt6-WebEngine>=6.7",
    "flask>=3.0",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
]
packaging = [
    "pyinstaller>=6.6",
    "Pillow>=10.0",
]

[project.scripts]
f5tool = "app.main:main"
f5tool-gui = "app.gui.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["resources/*", "modules/vpe_viewer/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
